spring.application.name=libracore

# ==============================
# DATABASE CONFIGURATION
# ==============================

spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/library_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==============================
# JPA CONFIGURATION
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==============================
# SERVER CONFIGURATION
# ==============================

server.port=${PORT:8080}


# ==============================
# JWT CONFIGURATION
# ==============================

jwt.secret=${JWT_SECRET:library-management-system-development-secret-key-2026}


app.base-url=${APP_BASE_URL:http://localhost:8080}
